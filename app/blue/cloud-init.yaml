#cloud-config
package_update: true
packages:
  - python3
  - python3-venv
  - python3-pip
write_files:
  - path: /usr/local/bin/setup-pulseops.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e
      mkdir -p /opt/pulseops/static
      python3 -m venv /opt/pulseops/.venv
      echo 'ZmFzdGFwaT09MC4xMTUuMTIKdXZpY29ybltzdGFuZGFyZF09PTAuMzQuMgo=' | base64 -d > /opt/pulseops/requirements.txt
      /opt/pulseops/.venv/bin/pip install --upgrade pip
      /opt/pulseops/.venv/bin/pip install -r /opt/pulseops/requirements.txt
      echo '' | base64 -d > /opt/pulseops/main.py
      echo '' | base64 -d > /opt/pulseops/static/index.html
      cat > /etc/systemd/system/pulseops.service <<'UNIT'
      [Unit]
      Description=PulseOps FastAPI Application
      After=network-online.target
      Wants=network-online.target
      [Service]
      Environment=APP_COLOR=blue
      Environment=APP_VERSION=v1.0.0
      WorkingDirectory=/opt/pulseops
      ExecStart=/opt/pulseops/.venv/bin/uvicorn main:app --host 0.0.0.0 --port 80
      Restart=always
      RestartSec=3
      [Install]
      WantedBy=multi-user.target
      UNIT
      systemctl daemon-reload
      systemctl enable --now pulseops.service
runcmd:
  - [bash, /usr/local/bin/setup-pulseops.sh]
